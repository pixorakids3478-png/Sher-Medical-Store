<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f3a7e"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <!-- Background Shield / Hexagon -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#medGrad)"/>
  <!-- Subtle inner border -->
  <rect x="10" y="10" width="100" height="100" rx="24" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
  
  <!-- Medical Cross with subtle curved elegance -->
  <g filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))">
    <!-- Vertical bar -->
    <rect x="50" y="28" width="20" height="64" rx="7" fill="#ffffff"/>
    <!-- Horizontal bar -->
    <rect x="28" y="50" width="64" height="20" rx="7" fill="#ffffff"/>
    
    <!-- Heartbeat / Pulse Accent in Center -->
    <path d="M36 60 H48 L53 49 L59 71 L65 54 L69 63 L73 60 H84" stroke="url(#tealGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Tiny Pharmacy Star of Life Leaf Accent -->
  <circle cx="82" cy="38" r="5" fill="#14b8a6"/>
</svg>
